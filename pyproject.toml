[project]
name = "ComfyUI_IC-Light-v2_fal"
description = "ComfyUI custom node using the fal.ai API for the IC-Light V2 model"
readme = "README.md"
version = "0.1.1"
license = {file = "LICENSE"}
dependencies = [
    "fal-client>=0.5.0",
    "configparser>=5.0.0",
    "requests>=2.25.0",
    "pillow>=9.0.0",
]

[project.urls]
Repository = "https://github.com/a-und-b/ComfyUI_IC-Light-v2_fal"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "a-und-b"
DisplayName = "IC-Light V2 (fal.ai)"
Icon = ""

[tool.pytest.ini_options]
# The repo dir name has hyphens, so pytest cannot import the package
# __init__.py; stop its parent walk at tests/.
testpaths = ["tests"]
addopts = "--confcutdir=tests"
